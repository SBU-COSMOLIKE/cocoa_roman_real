theory:
  emul_cosmic_shear:
    path: ./cobaya/cobaya/theories/
    stop_at_error: True
    extra_args: 
      device: 'cuda'
      file: ['./projects/roman_real/emulators/w0wa_nla_halofit_cosmic_shear_cnn/roman_real_cs_CNN.emul']
      extra: ['./projects/roman_real/emulators/w0wa_nla_halofit_cosmic_shear_cnn/roman_real_cs_CNN.h5']
      ord: [['As_1e9','ns','H0','omegab', 'omegam', 'w', 'w0pwa',
        'roman_DZ_S1','roman_DZ_S2','roman_DZ_S3','roman_DZ_S4',
        'roman_DZ_S5','roman_DZ_S6','roman_DZ_S7','roman_DZ_S8',
        'roman_A1_1','roman_A1_2']]
      fast_params: [['roman_M1','roman_M2','roman_M3','roman_M4','roman_M5','roman_M6','roman_M7','roman_M8']]
      extrapar: [{'MLA': 'CNN', 
        'INT_DIM_RES': 256, 
        'CNN_DIM': 576, 
        'KERNEL_DIM': 21,
        'OUTPUT_DIM': 1080}]

  emul_ggl:
    path: ./cobaya/cobaya/theories/
    stop_at_error: True
    extra_args: 
      device: 'cuda'
      file: ['./projects/roman_real/emulators/w0wa_nla_halofit_ggl_cnn/roman_real_ggl_CNN.emul']
      extra: ['./projects/roman_real/emulators/w0wa_nla_halofit_ggl_cnn/roman_real_ggl_CNN.h5']
      ord: [['As_1e9','ns','H0','omegab', 'omegam', 'w', 'w0pwa',
        'roman_DZ_S1','roman_DZ_S2','roman_DZ_S3','roman_DZ_S4',
        'roman_DZ_S5','roman_DZ_S6','roman_DZ_S7','roman_DZ_S8',
        'roman_A1_1','roman_A1_2']]
      fast_params: [['roman_M1','roman_M2','roman_M3','roman_M4',
                     'roman_M5','roman_M6','roman_M7','roman_M8',
                     'roman_B1_1','roman_B1_2','roman_B1_3','roman_B1_4',
                     'roman_B1_5','roman_B1_6','roman_B1_7','roman_B1_8']] # FIX COMING SOON
      extrapar: [{'MLA': 'CNN', 
        'INT_DIM_RES': 256, 
        'CNN_DIM': 576, 
        'KERNEL_DIM': 21,
        'OUTPUT_DIM': 915}]

  emul_wtheta:
    path: ./cobaya/cobaya/theories/
    stop_at_error: True
    extra_args: 
      device: 'cuda'
      file: ['./projects/roman_real/emulators/w0wa_nla_halofit_wtheta_cnn/roman_real_gc_CNN.emul']
      extra: ['./projects/roman_real/emulators/w0wa_nla_halofit_wtheta_cnn/roman_real_gc_CNN.h5']
      ord: [['As_1e9','ns','H0','omegab', 'omegam', 'w', 'w0pwa',
        'roman_DZ_S1','roman_DZ_S2','roman_DZ_S3','roman_DZ_S4',
        'roman_DZ_S5','roman_DZ_S6','roman_DZ_S7','roman_DZ_S8']]
      fast_params: [['roman_B1_1','roman_B1_2','roman_B1_3','roman_B1_4',
                     'roman_B1_5','roman_B1_6','roman_B1_7','roman_B1_8']] # FIX COMING SOON
      extrapar: [{'MLA': 'CNN', 
        'INT_DIM_RES': 256, 
        'CNN_DIM': 576, 
        'KERNEL_DIM': 21,
        'OUTPUT_DIM': 120}]

  emulrdrag:
    path: ./cobaya/cobaya/theories/
    provides: ['rdrag']
    extra_args:
      file: ['external_modules/data/emultrf/BAO_SN_RES/emul_lcdm_rdrag_GP.joblib'] 
      extra: ['external_modules/data/emultrf/BAO_SN_RES/extra_lcdm_rdrag.npy'] 
      ord: [['omegabh2','omegach2']]

  emulbaosn:
    path: ./cobaya/cobaya/theories/
    stop_at_error: True
    extra_args:
      device: "cuda"
      file:  [None, 'external_modules/data/emultrf/BAO_SN_RES/emul_lcdm_H.pt']
      extra: [None, 'external_modules/data/emultrf/BAO_SN_RES/extra_lcdm_H.npy']    
      ord: [None, ['omegam','H0']]
      extrapar: [{'MLA': 'INT', 'ZMIN' : 0.0001, 'ZMAX' : 3, 'NZ' : 600},
                 {'MLA': 'ResMLP', 'offset' : 0.0, 'INTDIM' : 1, 'NLAYER' : 1,
                  'TMAT': 'external_modules/data/emultrf/BAO_SN_RES/PCA_lcdm_H.npy',
                  'ZLIN': 'external_modules/data/emultrf/BAO_SN_RES/z_lin_lcdm.npy'}]

