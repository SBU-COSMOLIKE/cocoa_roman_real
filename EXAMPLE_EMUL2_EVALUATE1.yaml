      roman_M3: 0.0
      roman_M4: 0.0
      roman_M5: 0.0
      roman_M6: 0.0
      roman_M7: 0.0
      roman_M8: 0.0
      roman_A1_1: 0.6
      roman_A1_2: -1.5
      w0pwa: -1.0
      w: -1.0
